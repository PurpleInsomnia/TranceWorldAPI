<!DOCTYPE html>
<html>

    <head>

        <style>
            @font-face {
                font-family: 'Eras';
                src: url("web_assets/fonts/eras.ttf");
            }

            body {
                    font-family: 'Eras';
                    background-image: url("web_assets/images/background.png");
                    background-position: center;
                    background-size: cover;
                    background-repeat: repeat;
                    justify-content: center;
                    align-items: center;
                }

            p {
                color: white;
                background-image: url("web_assets/images/textBG.png");
                background-repeat: no-repeat;
                background-position: center;
            }

            .image {
                display: block;
                margin-left: auto;
                margin-right: auto;
                width: 50%;
                max-width: 50%;
                height: auto;
                animation: imageAnimation 1s normal;
            }

            @keyframes imageAnimation {
                0% { opacity: 0;}
                100% { opacity: 1;}
            }

            .gameButton {
                display: block;
                margin-left: auto;
                margin-right: auto;
                width: 50%;
                max-width: 50%;
                height: auto;
                transition: transform 0.2s;
            }

            .gameButton:hover {
                transform: scale(1.1);
            }

            .platformIcon {
                cursor: pointer;
                margin-left: auto;
                margin-right: auto;
                max-width: 100%;
                max-height: 100%;
                height: auto;
                transition: transform 0.2s;
            }

            .platformIcon:hover {
                transform: scale(1.1);
            }

            .platformContainer {
                display: flex;
                justify-items: center;
                align-items: center;
                gap: 15px;
                padding: 20px;
                max-width: 50%;
                margin: 0 auto;
            }

            #video-frame {
                display: block;
                margin: 0 auto;
            }

            @media (max-width: 640px) {
                #video-frame {
                    max-width: 100%;
                    max-height: 100%;
                    width: auto;
                    height: auto;
                }
            }
        </style>

        <title>Trance World</title>
        <link rel="icon" type="images/x-icon" href="web_assets/images/icon.png">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

    </head>

    <body>

        <img src="web_assets/images/coming-soon.png" class="image">
        
        <br>
        <br>
        <p style="text-align: center; font-size: 35px;">
        PLAY THE GAME!!!
        <br>
        CHAPTER 1 RELEASES JUNE 10TH 2026!
        </p>

        <br>
        <br>
        <!--
        <a href="sites/play.html">
            <img src="web_assets/images/buttons/play.png" class="image">
        </a>
        -->
        <div class="platformContainer">
            <a href="https://www.newgrounds.com/portal/view/979798">
                <img src="web_assets/images/buttons/newgrounds.png" class="platformIcon">
            </a>
            <a href="https://gamejolt.com/games/tranceworld/834210">
                <img src="web_assets/images/buttons/gamejolt.png" class="platformIcon">
            </a>
            <a href="https://purpleinsomnia.itch.io/trance-world">
                <img src="web_assets/images/buttons/itch.png" class="platformIcon">
            </a>
        </div>

        <br>
        <br>
        <p style="text-align: center; font-size: 35px;">
        HOW DOES DONATING HELP THE GAME?
        </p>

        <br>
        <br>
        <a href="sites/how.html">
            <img src="web_assets/images/buttons/how.png" class="gameButton">
        </a>

        <br>
        <br>
        <p style="text-align: center; font-size: 35px;">
        TRANCE WORLD is a game by PURPLEINSOMNIA
        </p>

    </body>

</html>
